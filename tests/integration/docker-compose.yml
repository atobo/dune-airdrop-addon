services:
  postgres:
    image: registry.funcom.com/funcom/self-hosting/igw-postgres:17.4-alpine-fc-13
    environment:
      POSTGRES_USER: airdrop_test
      POSTGRES_PASSWORD: airdrop_test_only
      POSTGRES_DB: dune_airdrop_integration_test
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airdrop_test -d dune_airdrop_integration_test"]
      interval: 2s
      timeout: 2s
      retries: 30
