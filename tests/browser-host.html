<!doctype html><script>
const queue=Array.from({length:2000},(_,i)=>({id:i+1,character_name:'Player '+i,template_id:'Item'+i,stack_size:1,delivery_state:i===1?'UNCERTAIN':'WAITING_FOR_PLAYER',requires_recovery_approval:i===0}));
window.addEventListener('message',event=>{const m=event.data||{};if(m.type!=='dune-addon-request')return;let result={rows:[]};const q=m.payload?.query||'';if(q.includes("to_regclass('dune_airdrop.config')"))result={rows:[{config_table:'dune_airdrop.config',playtime_table:'dune_airdrop.active_playtime',queue_table:'dune_airdrop.pending_deliveries'}]};else if(q.includes('FROM dune_airdrop.pending_deliveries bpd'))result={rows:q.includes('LIMIT 500')?queue.slice(0,500):queue};else if(q.includes('GROUP BY delivery_state'))result={rows:[{delivery_state:'WAITING_FOR_PLAYER',count:1999},{delivery_state:'UNCERTAIN',count:1}]};event.source.postMessage({type:'dune-addon-response',addonId:m.addonId,requestId:m.requestId,ok:true,result},event.origin)});
</script><iframe id="addon" src="../web/index.html"></iframe>
