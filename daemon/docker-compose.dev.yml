# Development/example deployment only. Do not apply this to an existing
# production service without reviewing the host paths and UID/GID values.
services:
  airdrop-daemon:
    build: .
    # The standard self-hosted PostgreSQL endpoint is host-local (127.0.0.1).
    # The daemon must share the host network to reach that endpoint.
    network_mode: host
    restart: unless-stopped
    user: "${AIRDROP_DAEMON_UID:-1000}:${AIRDROP_DAEMON_GID:-1000}"
    # The Dune command wrapper uses Docker to query PostgreSQL and publish the
    # verified grant. Give the non-root daemon only the host Docker-socket GID.
    group_add:
      - "${DOCKER_SOCKET_GID:?set DOCKER_SOCKET_GID to stat -c '%g' /var/run/docker.sock}"
    environment:
      DUNE_DOCKER_ROOT: /repo
    volumes:
      - ${DUNE_DOCKER_ROOT:?set DUNE_DOCKER_ROOT}/.env:/repo/.env:ro
      - ${DUNE_DOCKER_ROOT:?set DUNE_DOCKER_ROOT}/runtime/data:/repo/runtime/data
      - ${DUNE_DOCKER_ROOT:?set DUNE_DOCKER_ROOT}/runtime/generated:/repo/runtime/generated
      - ${DUNE_DOCKER_ROOT:?set DUNE_DOCKER_ROOT}/runtime/scripts:/repo/runtime/scripts:ro
      - ${DUNE_DOCKER_ROOT:?set DUNE_DOCKER_ROOT}/runtime/secrets:/repo/runtime/secrets:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
